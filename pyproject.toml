[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding on Qwen3-0.6B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.mypy]
exclude = ["llm_sdk/"]
mypy_path = "llm_sdk"
